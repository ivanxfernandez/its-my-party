<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>It’s my party and I’ll cry if I want to</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0D0A12;--card:#18131F;--ink:#F6EEE3;--mut:#A99CB0;--ac:#FF7A1A;--on:#0D0A12;--ac2:#8BFF5A;--on2:#0D0A12;--ln:#2E2538;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Nunito",system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:28px 16px 48px}
h1{font:400 clamp(30px,8vw,48px)/1.1 "Creepster","Nunito",system-ui,sans-serif;margin:0 0 8px;letter-spacing:.2px}
.sub{color:var(--mut);margin:0 0 14px}
.pill{display:inline-block;background:var(--ac);color:var(--on);font-weight:600;border-radius:999px;padding:6px 16px}
nav{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 16px}
nav button{flex:none;border:1.5px solid var(--ln);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 16px;font:500 15px "Nunito",system-ui,sans-serif;cursor:pointer}
nav button[aria-pressed="true"]{background:var(--ac2);border-color:var(--ac2);color:#fff}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.card{background:var(--card);border:1.5px solid var(--ln);border-radius:16px;padding:14px}
.r{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--ln)}
.r:last-of-type{border-bottom:0}
input[type=text],select{font:400 16px "Nunito",system-ui,sans-serif;color:var(--ink);background:transparent;border:1px solid transparent;border-radius:8px;padding:8px;min-width:0;flex:1}
input[type=text]:hover,select:hover,input[type=text]:focus{border-color:var(--ln)}
input.t0{flex:0 0 92px;font-weight:600;color:var(--ac2)}
input.w{flex:0 0 38%}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--ac2);flex:none}
.x{border:0;background:none;color:var(--mut);font-size:22px;cursor:pointer;padding:4px 8px}
.add{margin-top:10px;border:1.5px dashed var(--ln);background:none;color:var(--ink);border-radius:10px;padding:8px 14px;font:500 15px "Nunito",system-ui,sans-serif;cursor:pointer}
.stat{font-weight:600;margin:0 0 10px}
.big{background:var(--ac);color:var(--on);border-radius:16px;padding:18px;font:400 24px/1.2 "Creepster","Nunito",system-ui,sans-serif;margin-bottom:12px}
.go{border:0;background:var(--ac2);color:#fff;border-radius:10px;padding:10px 16px;font:600 15px "Nunito",system-ui,sans-serif;cursor:pointer;text-decoration:none;display:inline-block}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chips span{border:1.5px solid var(--ln);background:var(--card);border-radius:999px;padding:5px 12px}
h2{font:400 22px "Creepster","Nunito",system-ui,sans-serif;margin:18px 0 8px}
p.n{color:var(--mut);margin:0 0 10px}

body{background:radial-gradient(900px 420px at 50% -120px,rgba(255,122,26,.28),transparent 70%),var(--bg)}
h1{letter-spacing:1.5px;color:var(--ac);text-shadow:0 0 18px rgba(255,122,26,.45)}
h1::after{content:" 🦇";font-size:.7em}
h2{letter-spacing:1px;color:var(--ac2)}
.card{box-shadow:0 0 0 1px rgba(139,255,90,.06),0 10px 30px rgba(0,0,0,.4)}
.big{letter-spacing:1px}
nav button[aria-pressed="true"]{color:var(--on2)}
.go{color:var(--on2)}
.hero{position:relative;overflow:hidden;background:linear-gradient(160deg,#2A1638,#18131F 60%);border:1.5px solid var(--ac);border-radius:20px;padding:26px 20px 22px;box-shadow:0 0 34px rgba(255,122,26,.18);margin-bottom:14px}
.hero .k{margin:0 0 6px;color:var(--ac2);font-weight:700;letter-spacing:2px;text-transform:uppercase;font-size:13px}
.hero h2{font-size:40px;line-height:1.05;margin:0 0 10px;color:var(--ink)}
.hero p{margin:0;color:var(--ink)}
.hero .bg{position:absolute;right:-6px;bottom:-14px;font-size:84px;opacity:.16;pointer-events:none}
.info{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:14px}
.info div{background:var(--card);border:1.5px solid var(--ln);border-radius:14px;padding:12px 14px}
.info b{display:block;color:var(--ac);font-size:13px;letter-spacing:1px;text-transform:uppercase}
.info span{display:block;font-weight:600;line-height:1.35;margin-top:2px}
.ppl{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.ppl span{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--ln);border-radius:999px;padding:4px 14px 4px 4px;font-weight:600}
.ppl i{font-style:normal;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#0D0A12}
.ppl em{font-style:normal;display:flex;flex-direction:column;line-height:1.2}
.ppl small{font-weight:400;font-size:12px;color:var(--mut)}
.sp{flex:none;color:var(--ac2);text-decoration:none;font-size:16px;padding:6px 8px}
.r.s{flex-wrap:wrap;gap:2px 8px}
.r.s input[type=text]{flex:1 1 100%}
.r.s select{flex:0 0 auto;margin-right:auto;color:var(--mut)}
.ppl i,.ppl .av{width:40px;height:40px;flex:none;border-radius:50%}
.ppl .av{object-fit:cover;border:2px solid var(--ac);box-sizing:border-box}
.ppl .ig{font-size:12px;font-weight:600;color:var(--ac2);text-decoration:none}
.acts{display:flex;flex-wrap:wrap;gap:10px}
</style>
</head>
<body>
<main>
<h1>It’s my party and I’ll cry if I want to</h1>
<p class="sub">Cumple de Iván y Andy, viernes 30 de octubre, en casa de Iván. Disfraces bienvenidos.</p>

</main>
<script>

var G=[{ok:false,n:"Ivxn"},{ok:false,n:"Andy"},{ok:false,n:"Susan"},{ok:false,n:"Kebin"},{ok:false,n:"Andrea"},{ok:false,n:"Sharuun"},{ok:false,n:"Karen"},{ok:false,n:"Alison"},{ok:false,n:"Juan"},{ok:false,n:"Lili"},{ok:false,n:"Sofi"},{ok:false,n:"Carol"},{ok:false,n:"Miki"},{ok:false,n:"Choco"},{ok:false,n:"Jan"},{ok:false,n:"Haylin"},{ok:false,n:"Mac Miller"},{ok:false,n:"Wavo"}];

if(!S)S={
guests:G.slice(),
food:[{ok:false,x:"Pastel",who:""},{ok:false,x:"Dulces de Halloween",who:""},{ok:false,x:"Botanas",who:""},{ok:false,x:"Platillo principal",who:""},{ok:false,x:"Bebidas y hielo",who:""},{ok:false,x:"Vasos, platos y servilletas",who:""}],
games:GM.slice(),
awards:[{x:"Disfraz más creativo",w:""},{x:"Disfraz más terrorífico",w:""},{x:"Disfraz más cómico",w:""},{x:"Mejor disfraz en pareja o grupo",w:""}],
songs:SG.slice(),pl:"",pick:"",v:2};
if(S.guests)S.guests.forEach(function(g){if(g.n=="Iván")g.n="Ivxn"});
if(!S.v||S.v<2){S.games=GM.slice();S.songs=SG.slice();S.pick="";if(S.guests&&S.guests.length&&!S.guests.some(function(g){return /^wavo$/i.test((g.n||"").trim())}))S.guests.push({ok:false,n:"Wavo"});S.v=2;try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
if(!S.guests||!S.guests.length){S.guests=G.slice();try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
var ref=null,ex=false,RO=false,OWN=false,dirty={},busy=false,tm=null;
function loc(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function save(k){loc();if(k)dirty[k]=1;if(ref&&!RO){clearTimeout(tm);tm=setTimeout(flush,700)}}
async function flush(){
if(busy){tm=setTimeout(flush,400);return}
var ks=Object.keys(dirty);if(!ks.length)return;
dirty={};busy=true;var o={};ks.forEach(function(k){o[k]=S[k]});
try{if(ex)await ref.update(o);else{await ref.set(S);ex=true}}
catch(e){try{await ref.set(S);ex=true}catch(e2){RO=true;note()}}
busy=false}
function seed(){if(ref&&!ex&&OWN&&!RO&&!busy){busy=true;ref.set(S).then(function(){ex=true},function(){}).then(function(){busy=false})}}
function note(){var n=document.getElementById("note");n.hidden=false;n.textContent="Esta versión es solo de lectura: para editar necesitas acceso de colaborador.";view()}
function apply(snap){
ex=snap.exists;
if(!ex){seed();return}
if(snap.metadata.hasPendingWrites)return;
var d=snap.data(),a=document.activeElement,ch=false;
Object.keys(S).forEach(function(k){if(dirty[k]||d[k]===undefined)return;if(JSON.stringify(d[k])!==JSON.stringify(S[k])){S[k]=JSON.parse(JSON.stringify(d[k]));ch=true}});
if(ch){loc();if(!(a&&a.tagName=="INPUT"&&a.type=="text"&&document.getElementById("v").contains(a)))view()}}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;")}
var FAV={"Lili":"Rata Blanca","Kebin":"Mac Miller","Sofi":"ADÉLA","Juan":"Twenty One Pilots","Carol":"Alejandra Guzmán","Sharuun":"Black Eyed Peas","Ivxn":"Joji y Twenty One Pilots","Andy":"Héctor Lavoe","Choco":"Tito El Bambino"};
var IGU={"Ivxn":"ivanxfernandez","Andy":"badassydna","Susan":"sus4n._","Juan":"lehnho_","Jan":"_jan.1_","Miki":"mikingmoran","Sharuun":"sharoonmoreira","Andrea":"andra.maquiz"};
function chip(o,i,P){var n=o.n.trim(),u=IGU[n],av=u?'<img class="av" src="img/'+u+'.jpg" alt="" loading="lazy">':'<i style="background:'+P[i%P.length]+'" aria-hidden="true">'+esc(n.charAt(0).toUpperCase())+'</i>';

var MO=["Llegada","Comida","Baile","Pastel","Karaoke"];
var SC={
guests:[["ok","check"],["n","text","Nombre"]],
food:[["ok","check"],["x","text","Qué falta"],["who","text","Quién lo trae","w"]],
games:[["ok","check"],["x","text","Juego"]],
awards:[["x","text","Premio"],["w","text","Ganador","w"]],
songs:[["x","text","Canción y artista"],["m","sel"]]};
var NEW={guests:{ok:false,n:""},food:{ok:false,x:"",who:""},games:{ok:false,x:""},awards:{x:"",w:""},songs:{x:"",m:"Baile"}};
var TABS=[["inv","Invitación"],["guests","Invitados"],["food","Comida"],["games","Juegos"],["cos","Disfraces"],["mus","Música"],["dir","A DONDE VOY"]];
var tab="inv";
function fld(k,i,o,f){
var a=' data-k="'+k+'" data-i="'+i+'" data-f="'+f[0]+'"';
if(f[1]=="check")return '<input type="checkbox" aria-label="Listo"'+a+(o[f[0]]?" checked":"")+'>';
if(f[1]=="sel")return '<select aria-label="Momento"'+a+'>'+MO.map(function(m){return "<option"+(o.m==m?" selected":"")+">"+m+"</option>"}).join("")+"</select>";
return (k=="guests"&&f[0]=="n"?'<span aria-hidden="true">⭐</span>':'')+'<input type="text" class="'+(f[3]||"")+'" placeholder="'+f[2]+'" value="'+esc(o[f[0]])+'"'+a+'>'}
function rows(k){
return '<div class="card">'+S[k].map(function(o,i){
return '<div class="r'+(k=="songs"?' s':'')+'">'+SC[k].map(function(f){return fld(k,i,o,f)}).join("")+(k=="songs"&&o.x?'<a class="sp" target="_blank" rel="noopener" aria-label="Buscar en Spotify" href="https://open.spotify.com/search/'+encodeURIComponent(o.x.replace(/\s*\(.*\)\s*$/,""))+'">▶</a>':'')+'<button class="x" data-del="'+k+'" data-i="'+i+'" aria-label="Quitar">×</button></div>'}).join("")+
'<button class="add" data-add="'+k+'">+ Agregar</button></div>'}
function cnt(k,f){return S[k].filter(function(o){return o[f]}).length}
function view(){
var h="";
if(tab=="inv"){var P=["#FF7A1A","#8BFF5A","#C58BFF","#FFD23F"],g=S.guests.filter(function(o){return o.n&&o.n.trim()});
h='<div class="hero"><span class="bg" aria-hidden="true">🎃</span><p class="k">Esta es tu invitación</p><h2>Halloween + doble cumple</h2><p>Iván y Andy cumplen años y lo celebramos juntos en plena semana de Halloween. Ven con tu disfraz y con ganas de cantar, jugar y conocer gente nueva.</p></div>'+
'<div class="info"><div><b>Cuándo</b><span>Viernes 30 de octubre, 7:00 pm</span></div><div><b>Dónde</b><span>Casa de Iván, Jardines de Verona</span></div><div><b>Dress code</b><span>Disfraz muy recomendado (hay concurso)</span></div><div><b>Qué habrá</b><span>Comida, juegos, karaoke y pastel</span></div></div>'+
'<h2>Quién viene</h2><p class="n">Para que ya se ubiquen antes de llegar: '+g.length+' personas y contando.</p><div class="ppl">'+g.map(function(o,i){return chip(o,i,P)}).join("")+'</div>'+

if(tab=="guests")h='<p class="stat">'+cnt("guests","ok")+" confirmados de "+S.guests.length+' invitados</p>'+rows("guests");
if(tab=="food")h='<p class="stat">'+cnt("food","ok")+" de "+S.food.length+' pendientes listos</p>'+rows("food");
if(tab=="games")h=(S.pick?'<div class="big">'+esc(S.pick)+"</div>":"")+'<button class="go" data-rand="1">Sacar un juego al azar</button><p class="n" style="margin-top:10px">Pensados para grupos de 6 a 18 y todas las edades.</p><h2>Lista de juegos</h2>'+rows("games")+'<h2>Qué tener listo</h2><div class="chips">'+["Bocina y extensión", "Playlist descargada (sin anuncios)", "Micrófono o app de karaoke", "Premios del concurso", "Papel higiénico para La momia", "Lotería y fichas", "Piñata con dulces", "Rincón de fotos con buena luz", "Velas y encendedor para el pastel", "Kleenex, por si alguien quiere llorar 😭"].map(function(c){return "<span>"+c+"</span>"}).join("")+"</div>";

if(tab=="mus"){var ok=/^https?:\/\//i.test(S.pl);h='<div class="card"><p class="n">Pega el link de tu playlist de Spotify o YouTube.</p><div class="r"><input type="text" id="pl" placeholder="https://..." value="'+esc(S.pl)+'" aria-label="Link de la playlist"></div><p style="margin:10px 0 0"><a class="go" id="op" target="_blank" rel="noopener"'+(ok?' href="'+esc(S.pl)+'"':' aria-disabled="true" style="opacity:.5"')+">Abrir playlist</a></p></div><h2>Canciones por momento</h2><p class='stat'>Regla de la casa: nada de canciones tristes. 🚫😭</p><p class='n'>Toca ▶ para buscar cada una en Spotify y agregarla a la playlist.</p>"+rows("songs")}
if(tab=="dir")h='<div class="card"><h2 style="margin-top:0">Jardines de Verona</h2><p style="margin:0 0 6px">10ma calle 10-77</p><p style="margin:0 0 6px">Codigo 6000 y 1197</p><p style="margin:0;font-weight:600">Familia Fernandez</p></div>';
document.getElementById("v").innerHTML=h;
document.getElementById("tabs").innerHTML=TABS.map(function(t){return '<button data-tab="'+t[0]+'" aria-pressed="'+(t[0]==tab)+'">'+t[1]+"</button>"}).join("");if(RO)document.querySelectorAll("#v input,#v select,#v button").forEach(function(e){e.disabled=true})}
document.addEventListener("click",function(e){
var b=e.target.closest("button");if(!b)return;
if(b.dataset.tab){tab=b.dataset.tab;view();return}
if(b.dataset.goto){tab=b.dataset.goto;view();window.scrollTo(0,0);return}
if(b.dataset.add){var k=b.dataset.add;S[k].push(JSON.parse(JSON.stringify(NEW[k])));save(k);view();var t=document.querySelectorAll('input[type="text"][data-k="'+k+'"]');if(t.length)t[t.length-SC[k].filter(function(f){return f[1]=="text"}).length].focus();return}
if(b.dataset.del){S[b.dataset.del].splice(+b.dataset.i,1);save(b.dataset.del);view();return}
if(b.dataset.rand){var l=S.games.filter(function(g){return !g.ok&&g.x});S.pick=l.length?l[Math.floor(Math.random()*l.length)].x:"Ya jugaron todo. ¡Agreguen más juegos!";save("pick");view()}});

if(t.id=="pl"){S.pl=t.value.trim();var a=document.getElementById("op");if(/^https?:\/\//i.test(S.pl)){a.href=S.pl;a.style.opacity=1;a.removeAttribute("aria-disabled")}else{a.removeAttribute("href");a.style.opacity=.5}save("pl");return}

var o=S[t.dataset.k][+t.dataset.i];
o[t.dataset.f]=t.type=="checkbox"?t.checked:t.value;save(t.dataset.k);

function days(){var n=new Date(),a=new Date(n.getFullYear(),n.getMonth(),n.getDate()),b=new Date(2026,9,30);return Math.round((b-a)/864e5)}

}catch(e){}
</script>
</body>
</html>
