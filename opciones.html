<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opciones de diseño</title>
<style>
:root{--bg:#F4F1F7;--ink:#221A2C;--mut:#6E6478;--card:#fff;--ln:#DDD5E6}
@media (prefers-color-scheme:dark){:root{--bg:#141118;--ink:#F2EEF6;--mut:#A79DB2;--card:#1E1A24;--ln:#332C3C}}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 system-ui,-apple-system,sans-serif}
main{max-width:1260px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:26px;margin:0 0 4px}
p{color:var(--mut);margin:0 0 20px}
.grid{display:flex;flex-wrap:wrap;gap:20px;justify-content:center}
figure{margin:0;background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:12px;width:min(100%,394px)}
figcaption{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 4px 10px;font-weight:600}
figcaption a{font-weight:500;font-size:14px;color:inherit}
iframe{display:block;width:100%;height:720px;border:0;border-radius:12px;background:#fff}
</style>
</head>
<body>
<main>
<h1>Opciones de diseño</h1>
<p>Misma fiesta, tres looks. Toquen las pestañas dentro de cada una para probarlas.</p>
<div class="grid">
<figure><figcaption>A · Noche de Halloween <a href="opcion-a.html" target="_blank">Abrir</a></figcaption><iframe src="opcion-a.html" title="Opción A"></iframe></figure>
<figure><figcaption>B · Retro años 60 <a href="opcion-b.html" target="_blank">Abrir</a></figcaption><iframe src="opcion-b.html" title="Opción B"></iframe></figure>
<figure><figcaption>C · Papel picado <a href="opcion-c.html" target="_blank">Abrir</a></figcaption><iframe src="opcion-c.html" title="Opción C"></iframe></figure>
</div>
</main>
</body>
</html>
